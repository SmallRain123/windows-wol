[project]
name = "windows-wol"
version = "0.1.0"
authors = [{ name = "samllrain123" }]
description = "WOL局域网唤醒工具，唤醒Windows主机并等待windows-mcp 8090端口就绪"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0",
]

[project.scripts]
windows-wol = "windows_wol:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.uv]
package = true
